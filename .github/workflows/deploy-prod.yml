name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

jobs:
  validate-input:
    name: Validate Deployment Request
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Deployment cancelled: confirmation not provided"
            echo "Please type 'deploy' to confirm production deployment"
            exit 1
          fi
          echo "✅ Deployment confirmed"

  deploy-prod:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: validate-input
    environment:
      name: production
      url: http://${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Backup current production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROD_PATH: ${{ secrets.VPS_PROD_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'ENDSSH'
          set -e

          echo "📦 Creating backup of current production..."
          BACKUP_DIR="/opt/fortiflow/backups/$(date +%Y%m%d_%H%M%S)"
          mkdir -p /opt/fortiflow/backups

          cd ${{ secrets.VPS_PROD_PATH }}
          CURRENT_VERSION=$(git describe --tags --always)
          echo "Current version: $CURRENT_VERSION"

          # Backup database
          cd backend
          docker compose exec -T postgres pg_dump -U fortiflow fortiflow > "$BACKUP_DIR/fortiflow_backup.sql"

          echo "✅ Backup created at: $BACKUP_DIR"
          echo "📌 Version: $CURRENT_VERSION"
          ENDSSH

      - name: Deploy to Production VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROD_PATH: ${{ secrets.VPS_PROD_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'ENDSSH'
          set -e

          echo "🚀 Deploying to Production environment..."
          cd ${{ secrets.VPS_PROD_PATH }}

          echo "📥 Pulling latest changes from GitHub..."
          git fetch origin
          git pull origin main

          echo "📦 New version:"
          cat version.json | grep version | head -1

          echo ""
          echo "🔄 Restarting Docker services..."
          cd backend
          docker compose down
          docker compose up -d --build

          echo ""
          echo "⏳ Waiting for services to start (20s)..."
          sleep 20

          echo ""
          echo "🏥 Running health check..."
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:80/health > /dev/null 2>&1; then
                  echo "✅ Production backend is healthy!"
                  break
              else
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                      echo "⏳ Retry $RETRY_COUNT/$MAX_RETRIES - waiting 10s..."
                      sleep 10
                  else
                      echo "❌ Health check failed after $MAX_RETRIES attempts!"
                      echo "📋 Last 50 lines of logs:"
                      docker compose logs --tail=50 backend
                      exit 1
                  fi
              fi
          done

          echo ""
          echo "📊 Service status:"
          docker compose ps

          echo ""
          echo "✅ Production deployment complete!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Successfully deployed to Production!"
          echo "📍 Production API: http://${{ secrets.VPS_HOST }}"
          echo "📚 Docs: http://${{ secrets.VPS_HOST }}/docs"
          echo "🏥 Health: http://${{ secrets.VPS_HOST }}/health"

      - name: Rollback instructions
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo ""
          echo "🔄 To rollback, run on VPS:"
          echo "  cd /opt/fortiflow/prod"
          echo "  git log --oneline -10  # Find previous commit"
          echo "  git checkout <previous-commit>"
          echo "  cd backend && docker compose restart"
          echo ""
          echo "📦 Or restore from backup:"
          echo "  ls /opt/fortiflow/backups/  # Find backup"
          echo "  cat /opt/fortiflow/backups/<timestamp>/fortiflow_backup.sql | docker compose exec -T postgres psql -U fortiflow fortiflow"
