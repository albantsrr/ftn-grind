name: Deploy to Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-dev:
    name: Deploy to Development VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dev VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEV_PATH: ${{ secrets.VPS_DEV_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'ENDSSH'
          set -e

          echo "📍 Deploying to Dev environment..."
          cd ${{ secrets.VPS_DEV_PATH }}

          echo "📥 Pulling latest changes from GitHub..."
          git fetch origin
          git pull origin main

          echo "📦 Current version:"
          cat version.json | grep version | head -1

          echo ""
          echo "🔄 Restarting Docker services..."
          cd backend
          docker compose -f docker-compose.dev.yml down
          docker compose -f docker-compose.dev.yml up -d --build

          echo ""
          echo "⏳ Waiting for services to start (15s)..."
          sleep 15

          echo ""
          echo "🏥 Running health check..."
          if curl -f http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ Dev backend is healthy!"
          else
              echo "❌ Health check failed!"
              echo "📋 Last 30 lines of logs:"
              docker compose -f docker-compose.dev.yml logs --tail=30 backend_dev
              exit 1
          fi

          echo ""
          echo "📊 Service status:"
          docker compose -f docker-compose.dev.yml ps

          echo ""
          echo "✅ Dev deployment complete!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment notification
        if: success()
        run: |
          echo "🎉 Successfully deployed to Dev environment!"
          echo "📍 Dev API: http://${{ secrets.VPS_HOST }}:3001"
          echo "📚 Docs: http://${{ secrets.VPS_HOST }}:3001/docs"
          echo "🏥 Health: http://${{ secrets.VPS_HOST }}:3001/health"
