name: Release FortiFlow
#ok
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri application
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Generate update manifest
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: frontend/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          # Get the MSI file
          $MSI_FILE = Get-ChildItem -Path "msi\*.msi" | Select-Object -First 1

          # Get version from tag
          $VERSION = "${{ github.ref_name }}".TrimStart('v')

          # Get current UTC time
          $PUB_DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          # Find the signature file (search in msi directory and parent directories)
          Write-Host "Searching for signature file..."
          Write-Host "MSI file: $($MSI_FILE.Name)"

          # List all .sig files to debug
          Write-Host "All .sig files in bundle directory:"
          Get-ChildItem -Path "." -Recurse -Filter "*.sig" | ForEach-Object { Write-Host "  - $($_.FullName)" }

          $SIG_FILE = Get-ChildItem -Path "." -Recurse -Filter "*.sig" | Where-Object { $_.Name -eq "$($MSI_FILE.Name).sig" } | Select-Object -First 1

          if (-not $SIG_FILE) {
            Write-Warning "Signature file not found for $($MSI_FILE.Name)"
            Write-Warning "This release will NOT support auto-update verification"
            Write-Warning "To enable auto-update, configure TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets"

            # Create manifest without signature (updater will still work but without verification)
            $manifest = @{
              version = $VERSION
              notes = "See release notes at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
              pub_date = $PUB_DATE
              platforms = @{
                "windows-x86_64" = @{
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($MSI_FILE.Name)"
                }
              }
            } | ConvertTo-Json -Depth 10
          } else {
            Write-Host "Signature file found: $($SIG_FILE.FullName)"

            # Read signature
            $SIGNATURE = Get-Content -Path $SIG_FILE.FullName -Raw

            # Create latest.json manifest with signature
            $manifest = @{
              version = $VERSION
              notes = "See release notes at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
              pub_date = $PUB_DATE
              platforms = @{
                "windows-x86_64" = @{
                  signature = $SIGNATURE.Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($MSI_FILE.Name)"
                }
              }
            } | ConvertTo-Json -Depth 10
          }

          $manifest | Out-File -FilePath "latest.json" -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content "latest.json"

      - name: Upload Windows MSI
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fortiflow-windows-msi
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows EXE
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fortiflow-windows-exe
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/latest.json
          draft: true
          generate_release_notes: true
