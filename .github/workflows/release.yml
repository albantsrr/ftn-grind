name: Release FortiFlow
#ok
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri application
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Generate update manifest
        if: matrix.platform == 'windows-latest'
        working-directory: frontend/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          # Get the MSI and NSIS files
          MSI_FILE=$(ls msi/*.msi | head -n 1)
          NSIS_FILE=$(ls nsis/*.exe 2>/dev/null | head -n 1 || echo "")

          # Get version from tag
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Create latest.json manifest
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "See release notes at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat ${MSI_FILE}.sig)",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename $MSI_FILE)"
              }
            }
          }
          EOF

          cat latest.json

      - name: Upload Windows MSI
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fortiflow-windows-msi
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows EXE
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fortiflow-windows-exe
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/latest.json
          draft: true
          generate_release_notes: true
