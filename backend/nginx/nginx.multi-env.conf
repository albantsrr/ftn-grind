events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Upstream backends
    upstream backend_prod {
        server backend:8000;
    }

    upstream backend_dev {
        server backend_dev:8000;
    }

    # Production API (default)
    server {
        listen 80 default_server;
        server_name _;

        # Max body size (for file uploads if needed later)
        client_max_body_size 10M;

        # Add environment header for debugging
        add_header X-FortiFlow-Environment "production" always;

        # Proxy to production FastAPI backend
        location / {
            proxy_pass http://backend_prod;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Development API (on /dev path or dev subdomain)
    server {
        listen 80;
        server_name dev.*;

        # Max body size
        client_max_body_size 10M;

        # Add environment header for debugging
        add_header X-FortiFlow-Environment "development" always;

        # Proxy to development FastAPI backend
        location / {
            proxy_pass http://backend_dev;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Alternative: Dev API on /dev path (comment out the dev server above if using this)
    # This allows accessing dev via http://72.61.166.22/dev/...
